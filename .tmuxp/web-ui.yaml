session_name: 'web-ui'
windows:
- layout: d33f,176x49,0,0,2
  panes:
  - 'docker compose up -d'
  start_directory: ~/app/service/web/web-ui
  window_name: docker
- layout: tiled
  panes:
  - 'lein refresh && npm ci && shadow-cljs watch app'
  - focus: true
  start_directory: ~/app/service/web/web-ui
  window_name: shadow-cljs
- focus: 'true'
  layout: d33e,176x49,0,0,1
  panes:
  - 'nvim'
  start_directory: ~/app
  window_name: nvim
